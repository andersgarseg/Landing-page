<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Landing Page</title>
</head>
<body>
    <header class="header">
        <div class="logo-links">
            <h1 class="logo">Header Logo</h1>
            <a class="link1" href="">Header link one</a>
            <a class="link2" href="">Header link two</a>
            <a class="link3" href="">Header link three</a>
        </div>
    </header>

    <main>
        <section class="section-1">
            <div class="section-1-content">
                <div class="section-1-text">
                  <h1 class="section1h1">This website is<br>awesome!</h1>
                  <p class="section1p">This website has some subtext that goes here under the <br> 
                    main title. </p>
                  <button><a href="#" class="cta-button">Get Started</a></button>
                </div>
            </div>
            <div class="section-1-image">
              <div class="image-container">
                Placeholder for image
              </div>  
            </div>
        </section>

        <section class="section-2">
            <h2>About Us</h2>
            <div class="section-2-content">
                <img src="about-image.png" alt="About Image" subtext="We are a team of passionate individuals dedicated to delivering high-quality solutions.">
                <img src="about-image-2.png" alt="About Image 2" subtext="We provide top-notch services to our clients.">
                <img src="about-image-3.png" alt="About Image 3" subtext="We are committed to excellence in every project we undertake.">
                <img src="about-image-4.png" alt="About Image 4" subtext="Our team is dedicated to providing the best service.">
            </div>
        </section>

        <section class="section-3">
            <p></p>
        </section>

    </main>

    <footer>
        <div class="footer-content">
            <p>Call to action! It's time to get started!</p>
            <button class="cta-button">Get Started</button>
        </div>
    </footer>
</body>
</html>
